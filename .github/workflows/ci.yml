name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv pip install --system -e ".[dev,checkpoint,serve]"
      - name: Lint
        run: ruff check ttt tests scripts
      - name: Format check
        run: ruff format --check ttt tests scripts
      - name: Compile
        run: python -m compileall -q ttt scripts
      - name: Fast tests
        run: >-
          pytest -q
          tests/test_configuration.py
          tests/test_causality.py
          tests/test_grouped_gradients.py
          tests/test_kernels.py
          tests/test_meta_gradients.py
          tests/test_multi_token.py
          tests/test_runtime_consistency.py
          tests/test_session_store.py
