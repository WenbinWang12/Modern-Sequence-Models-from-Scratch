name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --python 3.12 --extra dev --extra checkpoint --extra serve
      - name: Lint
        run: uv run ruff check ttt tests scripts
      - name: Format check
        run: uv run ruff format --check ttt tests scripts
      - name: Compile
        run: uv run python -m compileall -q ttt scripts
      - name: Fast tests
        run: >-
          uv run pytest -q
          tests/test_configuration.py
          tests/test_causality.py
          tests/test_grouped_gradients.py
          tests/test_kernels.py
          tests/test_meta_gradients.py
