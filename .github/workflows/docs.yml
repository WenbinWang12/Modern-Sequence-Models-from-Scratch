name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r docs/requirements.txt
      - name: Install publication fonts and Cairo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcairo2 fonts-noto-cjk fonts-dejavu-core
      - name: Export publication figures
        run: python docs/tools/export_figures.py --docs-dir docs
      - name: Build documentation
        run: mkdocs build --site-dir site
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          force_orphan: true
          enable_jekyll: false
