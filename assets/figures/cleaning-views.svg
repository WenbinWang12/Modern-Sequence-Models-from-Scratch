</defs>
<rect x="0" y="0" width="1160" height="1080" rx="0" fill="#f8f6f0" stroke="none" stroke-width="1.5" opacity="1"/>
<rect x="0" y="0" width="1160" height="9" rx="0" fill="#147d73" stroke="none" stroke-width="1.5" opacity="1"/>
<text x="52" y="49" font-size="20" fill="#147d73" font-weight="700" text-anchor="start" xml:space="preserve">06 / DATA CLEANING</text>
<text x="1108" y="49" font-size="18" fill="#5a6c72" font-weight="500" text-anchor="end" xml:space="preserve">MODERN SEQUENCE MODELS</text>
<text x="52" y="108" font-size="37" fill="#18313d" font-weight="700" text-anchor="start" xml:space="preserve">Preserve the text. Separate the views.</text>
<text x="52" y="146" font-size="22" fill="#5a6c72" font-weight="400" text-anchor="start" xml:space="preserve">Text and measurement views have distinct roles. Measurements never overwrite training text.</text>
