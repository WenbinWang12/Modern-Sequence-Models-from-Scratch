<text x="738" y="509" font-size="24" fill="#a66a24" font-weight="700" text-anchor="start" xml:space="preserve">Measurement views</text>
<text x="738" y="550" font-size="22" fill="#18313d" font-weight="400" text-anchor="start" xml:space="preserve">strip text → length</text>
<text x="738" y="585" font-size="22" fill="#18313d" font-weight="400" text-anchor="start" xml:space="preserve">strip lines → repetition</text>
<text x="713" y="642" font-size="21" fill="#a66a24" font-weight="600" text-anchor="start" xml:space="preserve">No write-back to text</text>
<path d="M 323 609 L 323 669" fill="none" stroke="#147d73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-147d73)" opacity="1"/>
