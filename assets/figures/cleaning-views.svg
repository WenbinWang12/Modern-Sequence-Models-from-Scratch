<text x="87" y="509" font-size="20" fill="#147d73" font-weight="700" text-anchor="start" class="mono" xml:space="preserve">text</text>
<text x="88" y="551" font-size="27" fill="#18313d" font-weight="500" text-anchor="start" class="mono" xml:space="preserve">&quot;    return x + 1\n&quot;</text>
<text x="88" y="584" font-size="20" fill="#5a6c72" font-weight="400" text-anchor="start" xml:space="preserve">Indentation and final newline are retained.</text>
