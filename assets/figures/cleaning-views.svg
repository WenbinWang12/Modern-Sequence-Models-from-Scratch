<rect x="220" y="682" width="720" height="84" rx="42" fill="#18313d" stroke="none" stroke-width="1.5" opacity="1"/>
<text x="580" y="715" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">Rules determine the outcome</text>
