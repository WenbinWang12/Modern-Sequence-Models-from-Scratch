<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1080" role="img" aria-labelledby="title desc">
<title id="title">Preserve the text. Separate the views.</title>
<desc id="desc">A normalized text retains its four indentation spaces. A one-way copy creates measurement views, with no arrow back into training text. For the full 13-line fixture, five records are kept and eight rejected; applicable diagnostics have ten hits, which are not ten rejected records.</desc>
<defs>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",Inter,system-ui,sans-serif}.mono{font-family:"DejaVu Sans Mono","Cascadia Code",Consolas,monospace}</style>
