<circle cx="82" cy="212" r="18" fill="#147d73" stroke="none" stroke-width="1.5"/>
<text x="82" y="219" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">1</text>
<text x="115" y="220" font-size="25" fill="#18313d" font-weight="700" text-anchor="start" xml:space="preserve">Keep the original</text>
<rect x="68" y="250" width="518" height="128" rx="7" fill="#243b43" stroke="none" stroke-width="1.5" opacity="0.055"/>
<path d="M 64 244 L 558 244 L 582 268 L 582 372 L 64 372 Z" fill="#ffffff" stroke="#d6dfdb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
