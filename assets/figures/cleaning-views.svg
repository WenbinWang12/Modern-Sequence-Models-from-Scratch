<text x="87" y="277" font-size="20" fill="#5a6c72" font-weight="500" text-anchor="start" class="mono" xml:space="preserve">original_text  ·  c02</text>
<rect x="107" y="298" width="80" height="35" rx="0" fill="#dfefe9" stroke="none" stroke-width="1.5" opacity="1"/>
<text x="88" y="325" font-size="27" fill="#18313d" font-weight="500" text-anchor="start" class="mono" xml:space="preserve">&quot;    return x + 1\n&quot;</text>
<text x="88" y="354" font-size="20" fill="#5a6c72" font-weight="400" text-anchor="start" xml:space="preserve">Four indentation spaces remain.</text>
<text x="660" y="270" font-size="20" fill="#147d73" font-weight="700" text-anchor="start" xml:space="preserve">TEXT TRANSFORMS</text>
