<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1110" role="img" aria-labelledby="title desc">
<title id="title">Find candidates. Then choose representatives.</title>
<desc id="desc">Two signature bands produce four candidates among four exact-deduplication representatives. AB and BC have Jaccard 3/4; AD has 2/5 and BD 1/3. AC is not a candidate and has Jaccard 1/2. Ascending-ID decisions compare only retained representatives: remove B in favor of A; keep A, C, D. Five inputs yield three kept, one exact removal, and one near removal.</desc>
