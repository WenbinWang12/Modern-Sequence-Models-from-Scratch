<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">From text to evidence</title>
  <desc id="desc">A five-stage path from data to tokenizer, baseline model, frontier modules, and reproducible evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef4fb"/></linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4b8fc8"/><stop offset=".5" stop-color="#6b73c9"/><stop offset="1" stop-color="#d7657f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#18263c" flood-opacity=".14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#59708a"/></marker>
    <style>
      .eyebrow{font:700 14px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:2.4px;fill:#59708a}.title{font:700 31px Inter,ui-sans-serif,system-ui,sans-serif;fill:#172033}.subtitle{font:400 15px Inter,ui-sans-serif,system-ui,sans-serif;fill:#52657b}.num{font:700 14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#59708a;letter-spacing:1.5px}.card-title{font:700 19px Inter,ui-sans-serif,system-ui,sans-serif;fill:#172033}.card-copy{font:400 13px Inter,ui-sans-serif,system-ui,sans-serif;fill:#52657b}.pill{font:600 12px Inter,ui-sans-serif,system-ui,sans-serif;fill:#172033}.footer{font:600 13px Inter,ui-sans-serif,system-ui,sans-serif;fill:#b9c9da}
    </style>
  </defs>
  <rect width="1280" height="520" rx="28" fill="url(#bg)"/><path d="M0 105H1280" stroke="#d9e5f1"/><text x="64" y="51" class="eyebrow">MODERN SEQUENCE MODELS · FROM SCRATCH</text><text x="64" y="86" class="title">From text to evidence</text><text x="835" y="57" class="subtitle">one research loop, five explicit contracts</text><path d="M64 126H1216" stroke="url(#rule)" stroke-width="4" stroke-linecap="round"/>
  <g filter="url(#shadow)"><rect x="64" y="166" width="205" height="194" rx="20" fill="#dceeff"/><rect x="291" y="166" width="205" height="194" rx="20" fill="#ddf7ee"/><rect x="518" y="166" width="205" height="194" rx="20" fill="#fff0c2"/><rect x="745" y="166" width="205" height="194" rx="20" fill="#ffe0e8"/><rect x="972" y="166" width="244" height="194" rx="20" fill="#e9dfff"/></g>
  <g fill="none" stroke="#59708a" stroke-width="2" marker-end="url(#arrow)"><path d="M270 263H284"/><path d="M497 263H511"/><path d="M724 263H738"/><path d="M951 263H965"/></g>
  <g><text x="88" y="201" class="num">01 · DATA</text><text x="88" y="237" class="card-title">Corpus</text><text x="88" y="266" class="card-copy">source · license</text><text x="88" y="288" class="card-copy">cleaning · split</text><rect x="88" y="316" width="125" height="24" rx="12" fill="#fff" fill-opacity=".72"/><text x="100" y="333" class="pill">what is learned?</text>
  <text x="315" y="201" class="num">02 · REPRESENT</text><text x="315" y="237" class="card-title">Tokenizer</text><text x="315" y="266" class="card-copy">IDs · vocabulary</text><text x="315" y="288" class="card-copy">windows · masks</text><rect x="315" y="316" width="145" height="24" rx="12" fill="#fff" fill-opacity=".72"/><text x="327" y="333" class="pill">what is counted?</text>
  <text x="542" y="201" class="num">03 · BASELINE</text><text x="542" y="237" class="card-title">Dense LM</text><text x="542" y="266" class="card-copy">attention · FFN</text><text x="542" y="288" class="card-copy">causal objective</text><rect x="542" y="316" width="150" height="24" rx="12" fill="#fff" fill-opacity=".72"/><text x="554" y="333" class="pill">is the control sound?</text>
  <text x="769" y="201" class="num">04 · FRONTIER</text><text x="769" y="237" class="card-title">Stateful</text><text x="769" y="266" class="card-copy">TTT · Loop · MoE</text><text x="769" y="288" class="card-copy">cache · fast weights</text><rect x="769" y="316" width="151" height="24" rx="12" fill="#fff" fill-opacity=".72"/><text x="781" y="333" class="pill">what changes?</text>
  <text x="996" y="201" class="num">05 · EVIDENCE</text><text x="996" y="237" class="card-title">Report</text><text x="996" y="266" class="card-copy">loss · throughput</text><text x="996" y="288" class="card-copy">scaling · recovery</text><rect x="996" y="316" width="180" height="24" rx="12" fill="#fff" fill-opacity=".72"/><text x="1008" y="333" class="pill">can another run it?</text></g>
  <rect x="64" y="402" width="1152" height="68" rx="18" fill="#172033"/><circle cx="96" cy="436" r="7" fill="#8fe0c0"/><text x="119" y="430" class="footer" fill="#fff">THE SAME CONTRACT RUNS THROUGH EVERY CHAPTER</text><text x="119" y="451" class="footer">data fingerprint · token budget · seed · checkpoint · report</text><rect x="1018" y="421" width="162" height="30" rx="15" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".28"/><text x="1042" y="441" class="pill" fill="#fff">stable path + frontier</text>
</svg>
