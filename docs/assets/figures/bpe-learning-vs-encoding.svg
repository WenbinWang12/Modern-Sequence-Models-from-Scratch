<title id="title">Learn adjacent pairs; encode with the learned order</title><desc id="desc">Upper left: weighted base symbols for four word types and all eight first-round pair counts. Upper right: five frozen merge ranks and their counts when selected. Bottom: encode unseen catt by ranks 0 and 1, yielding cat t end marker, then look up IDs 7 5 0. Rank 2 cannot skip the remaining t.</desc>
