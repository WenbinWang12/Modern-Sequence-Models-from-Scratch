<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">预训练数据流水线</title>
  <desc id="desc">原始记录经过清洗、切分、词元化、打包和掩码，成为训练窗口与可审计证据。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#edf7f5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#172033" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#59708a"/></marker>
    <style>
      .eyebrow{font:700 13px "Noto Sans CJK SC","Microsoft YaHei",Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1px;fill:#59708a}.title{font:700 29px "Noto Sans CJK SC","Microsoft YaHei",Inter,ui-sans-serif,system-ui,sans-serif;fill:#172033}.copy{font:400 14px "Noto Sans CJK SC","Microsoft YaHei",Inter,ui-sans-serif,system-ui,sans-serif;fill:#52657b}.label{font:700 14px "Noto Sans CJK SC","Microsoft YaHei",Inter,ui-sans-serif,system-ui,sans-serif;fill:#172033}.small{font:400 12px "Noto Sans CJK SC","Microsoft YaHei",Inter,ui-sans-serif,system-ui,sans-serif;fill:#52657b}.tag{font:700 11px "Noto Sans CJK SC","Microsoft YaHei",Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1px;fill:#59708a}
    </style>
  </defs>
  <rect width="1200" height="500" rx="28" fill="url(#bg)"/><text x="56" y="48" class="eyebrow">第二部分 · 数据</text><text x="56" y="84" class="title">数据流水线定义学习目标</text><text x="56" y="112" class="copy">每一次变换都会改变最终进入损失函数的分布。</text>
  <path d="M56 143H1144" stroke="#d4e3e6" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="56" y="178" width="190" height="128" rx="18" fill="#dceeff"/><rect x="276" y="178" width="190" height="128" rx="18" fill="#e9e4ff"/><rect x="496" y="178" width="190" height="128" rx="18" fill="#ddf7ee"/><rect x="716" y="178" width="190" height="128" rx="18" fill="#fff0c2"/><rect x="936" y="178" width="208" height="128" rx="18" fill="#ffe0e8"/>
  </g>
  <g fill="none" stroke="#59708a" stroke-width="2" marker-end="url(#arrow)"><path d="M249 242H268"/><path d="M469 242H488"/><path d="M689 242H708"/><path d="M909 242H928"/></g>
  <g><text x="78" y="210" class="tag">01 · 原始</text><text x="78" y="241" class="label">记录</text><text x="78" y="267" class="small">文本 + 元数据</text><text x="78" y="287" class="small">来源 · 许可</text>
  <text x="298" y="210" class="tag">02 · 整理</text><text x="298" y="241" class="label">清洗 + 切分</text><text x="298" y="267" class="small">过滤 · 去重</text><text x="298" y="287" class="small">训练 / 验证 / 测试</text>
  <text x="518" y="210" class="tag">03 · 编码</text><text x="518" y="241" class="label">Tokenizer</text><text x="518" y="267" class="small">ID · 词表</text><text x="518" y="287" class="small">BOS · EOS · 回退</text>
  <text x="738" y="210" class="tag">04 · 成窗</text><text x="738" y="241" class="label">打包 + 掩码</text><text x="738" y="267" class="small">窗口 · shift</text><text x="738" y="287" class="small">边界 · 标签</text>
  <text x="958" y="210" class="tag">05 · 优化</text><text x="958" y="241" class="label">训练窗口</text><text x="958" y="267" class="small">X、Y、M → loss</text><text x="958" y="287" class="small">manifest · hash</text></g>
  <path d="M151 337C151 365 260 376 340 376H860C940 376 1049 365 1049 337" fill="none" stroke="#59708a" stroke-width="2" stroke-dasharray="5 7"/>
  <g filter="url(#shadow)"><rect x="56" y="392" width="330" height="62" rx="16" fill="#172033"/><rect x="435" y="392" width="330" height="62" rx="16" fill="#172033"/><rect x="814" y="392" width="330" height="62" rx="16" fill="#172033"/></g>
  <text x="78" y="419" class="tag" fill="#8fe0c0">能力</text><text x="78" y="440" class="small" fill="#d9e5f1">覆盖了哪些知识和行为？</text><text x="457" y="419" class="tag" fill="#ffd27e">成本</text><text x="457" y="440" class="small" fill="#d9e5f1">预算内有多少有效位置？</text><text x="836" y="419" class="tag" fill="#ff9fb3">有效性</text><text x="836" y="440" class="small" fill="#d9e5f1">结果能否复现和信任？</text>
</svg>
