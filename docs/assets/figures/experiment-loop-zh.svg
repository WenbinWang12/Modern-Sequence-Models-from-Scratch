<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">可复现实验闭环</title>
  <desc id="desc">实验从契约开始，经过运行、验证、比较和记录，再形成下一项问题。</desc>
  <defs>
    <linearGradient id="bgzhexp" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eef7f5"/></linearGradient>
    <filter id="shadowzhexp" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#172033" flood-opacity=".14"/></filter>
    <marker id="arrowzhexp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#59708a"/></marker>
    <style>.eyebrow{font:700 13px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:2px;fill:#59708a}.title{font:700 29px Inter,ui-sans-serif,system-ui,sans-serif;fill:#172033}.copy{font:400 14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#52657b}.label{font:700 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#172033}.small{font:400 12px Inter,ui-sans-serif,system-ui,sans-serif;fill:#52657b}.tag{font:700 11px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1px;fill:#59708a}.math{font:600 15px Georgia,serif;fill:#172033}</style>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bgzhexp)"/>
  <text x="56" y="48" class="eyebrow">第六部分 · 实验证据</text><text x="56" y="84" class="title">实验是一个闭环，不是一条数字</text><text x="56" y="112" class="copy">输入、成本、结果和边界必须一起记录，结论才可复核。</text><path d="M56 143H1144" stroke="#d5e4e1" stroke-width="2"/>
  <g filter="url(#shadowzhexp)"><rect x="56" y="188" width="200" height="126" rx="18" fill="#dceeff"/><rect x="282" y="188" width="200" height="126" rx="18" fill="#ddf7ee"/><rect x="508" y="188" width="200" height="126" rx="18" fill="#fff0c2"/><rect x="734" y="188" width="200" height="126" rx="18" fill="#ffe0e8"/><rect x="960" y="188" width="184" height="126" rx="18" fill="#e9dfff"/></g>
  <g fill="none" stroke="#59708a" stroke-width="2" marker-end="url(#arrowzhexp)"><path d="M265 251H272"/><path d="M491 251H498"/><path d="M717 251H724"/><path d="M943 251H950"/></g>
  <g><text x="80" y="220" class="tag">01 · CONTRACT</text><text x="80" y="252" class="label">固定变量</text><text x="80" y="281" class="small">数据 · 模型 · 预算</text>
  <text x="306" y="220" class="tag">02 · RUN</text><text x="306" y="252" class="label">训练与恢复</text><text x="306" y="281" class="small">日志 · checkpoint</text>
  <text x="532" y="220" class="tag">03 · VALIDATE</text><text x="532" y="252" class="label">验证边界</text><text x="532" y="281" class="small">因果性 · restore</text>
  <text x="758" y="220" class="tag">04 · COMPARE</text><text x="758" y="252" class="label">质量 × 成本</text><text x="758" y="281" class="small">loss · 显存 · 时间</text>
  <text x="984" y="220" class="tag">05 · RECORD</text><text x="984" y="252" class="label">下一个问题</text><text x="984" y="281" class="small">新 R，新证据</text></g>
  <path d="M1047 339C1047 386 1002 430 940 430H200C138 430 93 386 93 339" fill="none" stroke="#8f83d6" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowzhexp)"/>
  <text x="335" y="454" class="math">R =（源码、配置、数据、环境、状态、预算、证据）</text>
</svg>
