<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">TTT 跨 chunk 的快权重</title>
  <desc id="desc">序列按 chunk 处理，快权重在内循环更新，静态参数在外循环更新。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffafe"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#172033" flood-opacity=".14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#59708a"/></marker>
    <style>
      .eyebrow{font:700 13px "Noto Sans CJK SC","Microsoft YaHei",Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1px;fill:#59708a}.title{font:700 29px "Noto Sans CJK SC","Microsoft YaHei",Inter,ui-sans-serif,system-ui,sans-serif;fill:#172033}.copy{font:400 14px "Noto Sans CJK SC","Microsoft YaHei",Inter,ui-sans-serif,system-ui,sans-serif;fill:#52657b}.label{font:700 16px "Noto Sans CJK SC","Microsoft YaHei",Inter,ui-sans-serif,system-ui,sans-serif;fill:#172033}.small{font:400 12px "Noto Sans CJK SC","Microsoft YaHei",Inter,ui-sans-serif,system-ui,sans-serif;fill:#52657b}.math{font:600 15px Georgia,"Times New Roman",serif;fill:#172033}.tag{font:700 11px "Noto Sans CJK SC","Microsoft YaHei",Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1px;fill:#59708a}
    </style>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/><text x="56" y="48" class="eyebrow">第四部分 · TTT-E2E</text><text x="56" y="84" class="title">两个时钟，一条因果流</text><text x="56" y="112" class="copy">快权重在序列内适应；静态参数跨训练步学习。</text><path d="M56 143H1144" stroke="#d8deef" stroke-width="2"/>
  <text x="70" y="181" class="tag">观测到的序列</text><path d="M70 210H1118" stroke="#59708a" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="102" y="232" width="238" height="88" rx="16" fill="#dceeff"/><rect x="481" y="232" width="238" height="88" rx="16" fill="#ddf7ee"/><rect x="860" y="232" width="238" height="88" rx="16" fill="#fff0c2"/></g>
  <g><text x="126" y="260" class="tag">块 0</text><text x="126" y="288" class="label">x₁ … xₘ</text><text x="126" y="307" class="small">预测 → 观测标签</text><text x="505" y="260" class="tag">块 1</text><text x="505" y="288" class="label">xₘ₊₁ … x₂ₘ</text><text x="505" y="307" class="small">使用更新后的状态</text><text x="884" y="260" class="tag">块 2</text><text x="884" y="288" class="label">x₂ₘ₊₁ …</text><text x="884" y="307" class="small">继续当前会话</text></g>
  <path d="M340 276C396 244 425 244 481 276" fill="none" stroke="#d7657f" stroke-width="3" marker-end="url(#arrow)"/><path d="M719 276C775 244 804 244 860 276" fill="none" stroke="#d7657f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="381" y="228" class="math">φ₀ → φ₁</text><text x="760" y="228" class="math">φ₁ → φ₂</text>
  <g filter="url(#shadow)"><rect x="102" y="369" width="996" height="96" rx="18" fill="#172033"/></g>
  <text x="130" y="397" class="tag" fill="#ff9fb3">内循环</text><text x="130" y="423" class="small" fill="#d9e5f1">快权重根据已观测的 next-token 损失更新</text><text x="130" y="447" class="math" fill="#ffffff">φₜ₊₁ = φₜ − ηᵢₙₙₑᵣ ∇φ Lᵢₙₙₑᵣ</text>
  <text x="658" y="397" class="tag" fill="#8fe0c0">外循环</text><text x="658" y="423" class="small" fill="#d9e5f1">静态参数跨 batch 学习</text><text x="658" y="447" class="math" fill="#ffffff">θₖ₊₁ = Opt(θₖ, ∇θ Lₒᵤₜₑᵣ)</text>
  <path d="M1098 418C1142 418 1142 168 1108 168" fill="none" stroke="#8f83d6" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="1090" y="354" class="small" transform="rotate(-90 1090 354)">检查点 · 会话状态 · 证据</text>
</svg>
