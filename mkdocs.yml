site_name: Modern Sequence Models — From Scratch
site_description: 从随机初始化开始构建、训练和验证现代序列模型的双语实验书
site_url: https://wenbinwang12.github.io/Modern-Sequence-Models-from-Scratch/
repo_url: https://github.com/WenbinWang12/Modern-Sequence-Models-from-Scratch
repo_name: WenbinWang12/Modern-Sequence-Models-from-Scratch
copyright: Copyright 2026 Wenbin Wang

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.footnote.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 序章 — 为什么训练基模:
      - 训练系统全景: book/00_why_pretrain.md
  - Frontier Lab — 前沿专题:
      - 专题总览: frontier/index.md
      - TTT 与线性注意力: frontier/ttt_linear_attention.md
      - TTT-E2E 与长上下文: frontier/ttt_e2e_long_context.md
      - Looped Transformer: frontier/loop_transformer.md
  - Part I — 工具链:
      - 环境与第一次训练: book/01_environment.md
      - 仓库与实验记录: book/02_reproducible_runs.md
  - Part II — 数据:
      - 预训练数据：分布、质量与可复现性: book/10_data_contract.md
      - 数据获取、许可与溯源: book/11_data_acquisition.md
      - 数据清洗与质量过滤: book/12_data_cleaning.md
      - 精确与近似去重: book/13_deduplication.md
      - 数据切分与污染: book/14_split_and_contamination.md
      - Tokenizer 与词表: book/15_tokenizer.md
      - Token Packing 与 Mask: book/16_packing_and_masks.md
      - Dataset、分片与 manifest: book/17_dataset_and_manifest.md
      - 数据混合与确定性采样: book/18_data_mixture.md
      - 训练前数据验证: book/19_data_preflight.md
  - Part III — 标准基线:
      - 配置、词表与维度: book/03_configuration.md
      - Causal LM 基线: book/20_baseline_model.md
  - Part IV — 读懂 TTT-E2E:
      - 前向顺序与快权重: book/04_forward_and_ttt.md
      - 内循环与外循环: book/05_inner_outer_loop.md
  - Part V — 扩展模型:
      - 注意力、缓存与流式推理: book/06_attention_cache.md
      - MoE、路由与专家并行: book/07_moe.md
  - Part VI — 做实验:
      - 消融与 scaling: book/08_experiments.md
      - GPU、多卡与检查点验证: book/09_gpu_validation.md
  - 附录:
      - 复现命令: reproducibility.md
      - 验证记录: validation.md
      - 工程对齐: industry_alignment.md
      - 生产要求: production_requirements.md
  - English Edition:
