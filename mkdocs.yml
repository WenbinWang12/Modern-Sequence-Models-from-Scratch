      - Environment and first training run: book/en/01_environment.md
      - Reproducible runs: book/en/02_reproducible_runs.md
      - Configuration, vocabulary, and dimensions: book/en/03_configuration.md
      - Forward order and fast weights: book/en/04_forward_and_ttt.md
      - Inner and outer loops: book/en/05_inner_outer_loop.md
      - Attention, caches, and streaming: book/en/06_attention_cache.md
      - MoE and expert parallelism: book/en/07_moe.md
      - Ablations, cost, and scaling: book/en/08_experiments.md
      - GPU and checkpoint validation: book/en/09_gpu_validation.md
      - "Pretraining data: distribution, quality, and reproducibility": book/en/10_data_contract.md
      - Acquisition and provenance: book/en/11_data_acquisition.md
      - Cleaning and quality: book/en/12_data_cleaning.md
      - Deduplication: book/en/13_deduplication.md
