site_name: Modern Sequence Models — From Scratch
site_description: 从随机初始化开始构建、训练和验证现代序列模型的双语实验书
site_url: https://wenbinwang12.github.io/Modern-Sequence-Models-from-Scratch/
repo_url: https://github.com/WenbinWang12/Modern-Sequence-Models-from-Scratch
repo_name: WenbinWang12/Modern-Sequence-Models-from-Scratch
copyright: Copyright 2026 Wenbin Wang

extra:
  alternate:
    - name: 中文版
      link: https://wenbinwang12.github.io/Modern-Sequence-Models-from-Scratch/
      lang: zh
    - name: English
      link: https://wenbinwang12.github.io/Modern-Sequence-Models-from-Scratch/book/en/
      lang: en

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.footnote.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式

plugins:
  - search

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mermaid@11.12.1/dist/mermaid.min.js
  - javascripts/mermaid.js
extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

