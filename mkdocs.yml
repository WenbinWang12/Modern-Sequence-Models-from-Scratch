  - 阅读说明:
      - 全书统一记号: book/notation.md
  - 序章 — 为什么训练基模:
      - 训练系统全景: book/00_why_pretrain.md
  - Frontier Lab — 前沿专题:
      - 专题总览: frontier/index.md
      - TTT 与线性注意力: frontier/ttt_linear_attention.md
      - TTT-E2E 与长上下文: frontier/ttt_e2e_long_context.md
      - Looped Transformer: frontier/loop_transformer.md
  - Part I — 实验契约与工具链:
